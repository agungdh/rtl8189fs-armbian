name: Build 8189fs

on:
  workflow_dispatch:
    inputs:
      kernels:
        description: 'Comma-separated ophub kernel versions (e.g. 6.18.41,6.12.100)'
        required: false
        default: '6.18.41'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.set.outputs.kernels }}
    steps:
      - id: set
        run: |
          INPUT="${{ inputs.kernels }}"
          if [ -z "$INPUT" ]; then
            INPUT="6.18.41"
          fi
          echo "$INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | jq -Rc -s 'split("\n") | map(select(length > 0))' > /tmp/kernels.json
          echo "kernels=$(cat /tmp/kernels.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.resolve.outputs.kernels) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            make bc libelf-dev
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-14 /usr/local/bin/aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download & extract ophub headers for ${{ matrix.kernel }}
        env:
          KVER: ${{ matrix.kernel }}
        run: |
          KREL="${KVER}-ophub"
          curl -sL -o /tmp/deb-${KVER}.tar.gz \
            "https://github.com/ophub/kernel/releases/download/kernel_stable/deb-${KVER}.tar.gz"
          mkdir -p /tmp/deb-${KVER}
          tar xzf /tmp/deb-${KVER}.tar.gz -C /tmp/deb-${KVER}
          mkdir -p /tmp/headers
          dpkg-deb -x /tmp/deb-${KVER}/deb-${KVER}/linux-headers_${KVER}-1-ophub_arm64.deb /tmp/headers
          ls -la /tmp/headers/usr/src/linux-headers-${KREL}/.config

      - name: Rebuild kbuild host scripts (headers are ARM64-built)
        env:
          KVER: ${{ matrix.kernel }}
          KREL: ${{ matrix.kernel }}-ophub
        run: |
          cd /tmp/headers/usr/src/linux-headers-${KREL}
          rm -rf scripts
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

      - name: Compile 8189fs.ko
        env:
          KVER: ${{ matrix.kernel }}
          KREL: ${{ matrix.kernel }}-ophub
        run: |
          make clean
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               KSRC=/tmp/headers/usr/src/linux-headers-${KREL} \
               CONFIG_PLATFORM_AML_S905=y \
               -j$(nproc)
          file 8189fs.ko
          modinfo 8189fs.ko | head -10

      - name: Stage prebuilt module
        env:
          KVER: ${{ matrix.kernel }}
          KREL: ${{ matrix.kernel }}-ophub
        run: |
          mkdir -p "prebuilt/${KREL}"
          cp 8189fs.ko "prebuilt/${KREL}/"
          sha256sum "prebuilt/${KREL}/8189fs.ko"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8189fs-${{ matrix.kernel }}-ophub.ko
          path: prebuilt/${{ matrix.kernel }}-ophub/8189fs.ko

      - name: Commit prebuilt module back to repo
        if: github.ref_type == 'branch'
        env:
          KREL: ${{ matrix.kernel }}-ophub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "prebuilt/${KREL}/8189fs.ko"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add prebuilt 8189fs.ko for ${KREL}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
